server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: nginx-nomad

    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    relabel_configs:
      - source_labels:
          - __meta_docker_container_label_com_hashicorp_nomad_alloc_id
        regex: ".+"
        action: keep

      - source_labels:
          - __meta_docker_container_label_com_hashicorp_nomad_alloc_id
        target_label: nomad_alloc_id

      - source_labels:
          - __meta_docker_container_name
        regex: "/(.+)"
        target_label: container

      - target_label: service
        replacement: nginx-app

      - target_label: job
        replacement: nginx-nomad

    pipeline_stages:
      - docker: {}